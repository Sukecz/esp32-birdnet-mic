name: arduino-build

on:
  push:
  pull_request:

concurrency:
  group: arduino-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx
          python3 -m pip install -r tools/requirements-webui.txt
          npm ci --prefix tools --ignore-scripts
      - id: targets
        run: echo "matrix=$(python3 tools/board_registry.py --matrix)" >> "$GITHUB_OUTPUT"
      - run: python3 tools/test.py host
      - run: python3 tools/test.py release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-results
          path: tmp/test-results/

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefix tools --ignore-scripts
      - run: tools/node_modules/.bin/playwright-core install --with-deps chromium
      - run: python3 tools/test.py browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: tmp/test-results/

  compile:
    needs: host
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.host.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.0'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-${{ hashFiles('build-dependencies.json', 'tools/prepare_sd_library.py') }}
      - run: python3 tools/check_build_dependencies.py --install
      - name: Compile and check memory
        run: |
          tools/compile_firmware.sh --fqbn "${{ matrix.fqbn }}" --output-dir "tmp/build/${{ matrix.key }}"
          python3 tools/check_memory_budget.py "${{ matrix.id }}" "tmp/build/${{ matrix.key }}" ${{ matrix.enabled_psram_bytes == 0 && matrix.psram_bytes > 0 && '--no-psram' || '' }} > "tmp/build/${{ matrix.key }}/memory-report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: memory-${{ matrix.key }}
          path: tmp/build/${{ matrix.key }}/memory-report.json
